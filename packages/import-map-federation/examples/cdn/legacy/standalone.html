<!doctype html>
<meta charset="utf-8">
<title>Legacy MFE — standalone</title>
<style>
  :root { color-scheme: light dark; --bd:#d5d8dd; --mut:#666; }
  @media (prefers-color-scheme: dark) { :root { --bd:#3a3f47; --mut:#9aa0a8; } }
  body { font: 14px/1.55 system-ui, sans-serif; margin: 0; padding: 24px; max-width: 620px; }
  .lede { color: var(--mut); } code { font-size: 12px; }
  .card { border: 1px solid var(--bd); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 2px; font-size: 14px; } .sub, .id { color: var(--mut); font-size: 12px; margin: 2px 0; }
  .id { font-family: ui-monospace, monospace; }
  button { font: inherit; padding: 5px 11px; border: 1px solid var(--bd); border-radius: 6px;
           background: transparent; color: inherit; cursor: pointer; }
  strong { font-variant-numeric: tabular-nums; font-size: 16px; }
  .list { color: var(--mut); font-size: 12px; }
</style>
<h1 style="font-size:18px;margin:0 0 4px">Legacy MFE — standalone</h1>
<p class="lede">No host, no runtime. The same build artifact, its own packages, one static import map.</p>
<!-- Emitted at build time: a lone MFE has nothing to negotiate. -->
<script type="importmap">
{ "imports": { "@fed/ui": "./vendor/ui-1.2.0.js", "@fed/store": "./vendor/store-1.0.0.js" } }
</script>
<div id="root"></div>
<script type="module">
  import { mount } from './entry.js';
  window.__meta = mount(document.getElementById('root'));
  window.__ready = true;
</script>
